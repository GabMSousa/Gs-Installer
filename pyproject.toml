[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-installer"
version = "0.1.0"
description = "Portable Windows installer, cleanup and deep uninstall workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
gs-installer = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
